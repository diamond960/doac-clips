name: cut

# Push jobs/<video_id>.json (clip list) to cut and publish those clips.
on:
  push:
    paths: ["jobs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -U "yt-dlp[default]"
      - name: Cut clips
        run: python scripts/make_clips.py
      - name: Save results
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          git diff --cached --quiet && exit 0
          git commit -m "Clip results"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
